---
name: Go Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: 1.26.6

    - name: Test
      run:  go test -v -tags=release -cover ./...

    - name: Lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest
